name: Run Bosque Forex AI

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: bosque-forex-ai-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =====================================================
      # PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # =====================================================
      # RUN BOSQUE FOREX AI
      # =====================================================
      - name: Run Bosque Forex AI
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python engine/bosque_engine.py

      # =====================================================
      # COMMIT ENGINE OUTPUT FIRST
      # =====================================================
      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard_data.json
          git add engine/state.json

          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update BOSQUE FOREX AI data"
          fi

      # =====================================================
      # SYNC WITH LATEST MAIN
      # =====================================================
      - name: Sync latest main
        run: |
          git fetch origin main
          git rebase origin/main

      # =====================================================
      # PUSH
      # =====================================================
      - name: Push changes
        run: |
          git push origin HEAD:main