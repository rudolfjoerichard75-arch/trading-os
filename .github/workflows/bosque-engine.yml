name: Run Bosque Forex AI
on:
  push:
    branches: [main]
    paths:
      - "engine/*.py"
      - "engine/requirements.txt"
      - "engine/backtest_results.json"
      - ".github/workflows/bosque-engine.yml"
      - "tests/**"
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: bosque-forex-ai-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          node tests/test_dashboard.cjs
      - name: Run engine
        id: engine
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROUND_TRIP_COST_PIPS: ${{ vars.ROUND_TRIP_COST_PIPS }}
        run: python engine/bosque_engine.py
      - name: Preserve outputs and error status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in dashboard_data.json engine/trade_journal.json engine/news_cache.json engine/telegram_health.json paper_journal.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ -d engine/news_archive ]; then git add engine/news_archive; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update Bosque paper journal and health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bosque-state-${{ github.run_id }}
          path: |
            engine/trade_journal.json
            engine/news_cache.json
            engine/telegram_health.json
            engine/news_archive/
            paper_journal.csv
            dashboard_data.json
          retention-days: 30
      - name: Report engine failure
        if: steps.engine.outcome == 'failure'
        run: exit 1
