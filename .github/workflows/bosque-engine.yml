name: Bosque Forex AI Engine

on:

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bosque-forex-ai-engine
  cancel-in-progress: false

jobs:

  analyze:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Bosque Forex AI
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run Bosque Forex AI
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python engine/bosque_engine.py

      - name: Save engine state
        run: |

          git config user.name "Bosque Forex AI"
          git config user.email "bosque-ai@users.noreply.github.com"

          git add engine/state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Bosque AI engine state"
            git push
          fi