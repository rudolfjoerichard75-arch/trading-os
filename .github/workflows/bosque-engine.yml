name: Run BOSQUE FOREX AI
on:
  workflow_dispatch:
concurrency:
  group: bosque-v3-engine
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r engine/requirements.txt
      - name: V3 regression tests
        run: |
          python -m unittest discover -s tests -v
          node tests/test_dashboard.cjs
      - name: Run V3 engine
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROUND_TRIP_COST_PIPS: ${{ vars.ROUND_TRIP_COST_PIPS }}
        run: python engine/bosque_engine.py
      - name: Persist V3 data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in dashboard_data.json engine/state.json engine/trade_journal.json engine/trade_alerts.json engine/forward_test.json engine/news_cache.json engine/telegram_health.json engine/engine_health.json engine/market_snapshot.csv engine/market_data_audit.json engine/learning_summary.json paper_journal.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if [ -d engine/news_archive ]; then git add engine/news_archive; fi
          if [ -d engine/learning ]; then git add engine/learning; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update V3 dashboard and paper journal'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Reserve TP and close alerts
        run: python engine/bosque_trade_alerts.py reserve
      - name: Persist reservations before Telegram sends
        run: |
          git add engine/trade_alerts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve V3 trade notifications'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Send TP and close alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/bosque_trade_alerts.py dispatch
      - name: Persist trade alert delivery receipts
        if: always()
        run: |
          for file in engine/trade_alerts.json engine/telegram_health.json dashboard_data.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Update V3 trade notification receipts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Reserve direct Web Push alerts
        env:
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: python engine/bosque_push.py reserve
      - name: Persist push reservations before sending
        run: |
          git add push-config.json
          if [ -f engine/push_state.json ]; then git add engine/push_state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve direct Web Push notifications'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Send direct Web Push alerts
        env:
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: python engine/bosque_push.py dispatch
      - name: Persist Web Push receipts
        if: always()
        run: |
          if [ -f engine/push_state.json ]; then git add engine/push_state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update Web Push notification receipts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
