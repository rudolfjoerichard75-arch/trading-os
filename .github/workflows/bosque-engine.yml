name: Run BOSQUE FOREX AI

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Run BOSQUE FOREX AI
        run: |
          python engine/bosque_engine.py

      - name: Check dashboard data
        run: |
          test -f dashboard_data.json
          echo "dashboard_data.json OK"

      - name: Commit dashboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.json Engine/state.json
          git diff --cached --quiet || git commit -m "Update BOSQUE FOREX AI data"
          git push