name: Run BOSQUE FOREX AI

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Check environment
        run: |
          if [ -z "$TWELVEDATA_API_KEY" ]; then
            echo "ERROR: TWELVEDATA_API_KEY is missing"
            exit 1
          else
            echo "TWELVEDATA_API_KEY is loaded"
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "WARNING: TELEGRAM_BOT_TOKEN is missing"
          else
            echo "TELEGRAM_BOT_TOKEN is loaded"
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "WARNING: TELEGRAM_CHAT_ID is missing"
          else
            echo "TELEGRAM_CHAT_ID is loaded"
          fi

      - name: Run BOSQUE FOREX AI
        run: |
          python engine/bosque_engine.py

      - name: Check dashboard data
        run: |
          test -f dashboard_data.json
          echo "dashboard_data.json OK"

      - name: Commit dashboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard_data.json Engine/state.json

          git diff --cached --quiet || git commit -m "Update BOSQUE FOREX AI data"

          git push