name: Bosque one-time entry zone example
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bosque-example-20261021.yml']
permissions:
  contents: read
concurrency:
  group: bosque-example-20261021
  cancel-in-progress: false
jobs:
  send-example:
    if: github.event.head_commit.message == 'Send requested Telegram entry zone example 20261021' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r engine/requirements.txt
      - name: Send one labeled example to existing Bosque chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: engine
        run: |
          python - <<'PY'
          import json, os
          from bosque_engine import format_telegram
          from bosque_delivery import deliver
          plan = {'entry':4111.60,'sl':4119.26,'tp1':4105.60,'tp2':4096.27,'tp3':4088.61}
          example = format_telegram('SELL','SELL BREAKOUT RETEST',75,plan,'CONTOH',{'zone':'CONTOH'},{'atr_pips':32.4})
          message = '🧪 CONTOH FORMAT — BUKAN SIGNAL LIVE\nHarga contoh sahaja. Jangan buka posisi berdasarkan mesej ini.\n\n' + example + '\n\n🧪 DEMO-ENTRY-ZONE-20261021 | Bukan peluang dagangan semasa.'
          receipt = deliver(message, os.environ.get('TELEGRAM_BOT_TOKEN',''), os.environ.get('TELEGRAM_CHAT_ID',''))
          print(json.dumps(receipt))
          if receipt['status'] != 'SENT':
              raise SystemExit('Send not confirmed; do not automatically retry')
          PY
